name: '🧪 CI — Unit Tests'

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: '✅ Unit Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: '📥 Checkout repository'
        uses: actions/checkout@v4

      - name: '🧰 Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: '📦 Install dependencies'
        run: npm ci

      - name: '🧪 Run tests'
        run: npm run test:run
